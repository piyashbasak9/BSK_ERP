{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white">
                <h3 class="mb-0">Access Denied</h3>
            </div>
            <div class="card-body">
                <p class="mb-3">You do not have permission to access this page or perform this action.</p>
                <p>If you think this is a mistake, please contact your system administrator.</p>
                <a href="{% url 'dashboard' %}" class="btn btn-primary">Return to Dashboard</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
